version: 2.1

jobs:
  build_test_lint:
    docker:
      - image: cimg/android:2026.03.1-ndk

    working_directory: ~/project

    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g"

    steps:
      - checkout

      - run:
          name: Restore google-services.json
          command: |
            mkdir -p WebViewWindow/src/debug
            if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
              printf '%s' "${GOOGLE_SERVICES_JSON}" > WebViewWindow/src/debug/google-services.json
            else
              echo '{}' > WebViewWindow/src/debug/google-services.json
            fi

      - run:
          name: Build
          command: ./gradlew assembleDebug

      - run:
          name: Test
          command: ./gradlew testDebug

      - run:
          name: Lint
          command: ./gradlew lintDebug

      - store_test_results:
          path: WebViewWindow/build/test-results

      - store_artifacts:
          path: WebViewWindow/build/reports

workflows:
  ci:
    jobs:
      - build_test_lint
